// basis: what kind of knowledge each statement rests on: Qur'anic | Prophetic | Seerah | Islamic history | Geography

const LPP=8;
const PHASES=[
{name:"The Sacred Cities",intro:"Makkah and Madinah, and the places where revelation and the Hijrah unfolded."},
{name:"Hajj and the Holy Land",intro:"The rites of Hajj, Jerusalem and Al-Aqsa."},
{name:"Lands of the Qur'an",intro:"Mountains, seas and rivers that the Qur'an and the Sunnah speak about."},

const PLACES_ALL=[
{id:"kaabah",name:"The Ka'bah",location:"Makkah",category:"Sacred Place",basis:["Qur'anic","Prophetic"],description:"The cube-shaped House at the centre of Masjid al-Haram, towards which Muslims face in prayer. The Qur'an says Ibrahim and Isma'il raised its foundations.",quranReference:"2:127; 3:96; 22:26",hadithReference:"Sahih al-Bukhari, Book of the Prophets (Ibrahim and Isma'il building the House)",historicalReference:"Rebuilt by Quraysh before the Prophethood; the present structure largely dates from the 1630 CE reconstruction.",verification:"verified"},
{id:"makkah",name:"Makkah",location:"Saudi Arabia",category:"Sacred City",basis:["Qur'anic","Seerah"],description:"The birthplace of the Prophet ﷺ, where revelation began. The Qur'an names Makkah once and describes its sanctity in Ibrahim's prayer.",quranReference:"48:24 (named); 14:35; 95:3",hadithReference:"Sahih al-Bukhari 1834; Sahih Muslim 1353 (Allah made Makkah sacred)",historicalReference:"The Prophet ﷺ was born here and lived here until the Hijrah (622 CE); Makkah was opened in 8 AH.",verification:"verified"},
{id:"madinah",name:"Madinah",location:"Saudi Arabia",category:"Sacred City",basis:["Qur'anic","Seerah"],description:"Formerly Yathrib, the city that received the Prophet ﷺ at the Hijrah in 622 CE and became the first Muslim community's home.",quranReference:"9:101; 9:120; 33:60; 63:8",hadithReference:"Sahih al-Bukhari, Book of the Virtues of Madinah",historicalReference:"Capital of the first Islamic state; the Prophet ﷺ is buried here.",verification:"verified"},
{id:"nabawi",name:"Masjid an-Nabawi",location:"Madinah",category:"Mosque",basis:["Prophetic","Islamic history"],description:"The Prophet's Mosque, built by the Prophet ﷺ soon after the Hijrah. His grave lies in the adjoining chamber that was Aisha's room.",quranReference:"",hadithReference:"Sahih Muslim 1394 (virtue of prayer in it); Sahih Muslim 1397 (journeying to three mosques)",historicalReference:"Expanded many times from the Umayyad period to the present day.",verification:"verified"},
{id:"quba",name:"Masjid Quba",location:"Madinah",category:"Mosque",basis:["Qur'anic","Seerah"],description:"Generally regarded as the first mosque built after the Hijrah. Verse 9:108 speaks of a mosque founded on taqwa; many commentators apply it to Quba, while a narration in Muslim applies it to the Prophet's Mosque.",quranReference:"9:108",hadithReference:"Sahih al-Bukhari, Book of Virtues of Prayer in Makkah and Madinah (visiting Quba); Sahih Muslim 1398",historicalReference:"Founded on the Prophet's arrival at Quba, before entering Madinah.",verification:"scholarly_difference"},
{id:"uhud",name:"Mount Uhud",location:"Madinah",category:"Seerah Site",basis:["Seerah","Prophetic","Geography"],description:"A mountain just north of Madinah where the Battle of Uhud took place in 3 AH. Many of the Prophet's Companions were buried near its foot, including Hamzah.",quranReference:"3:121-175 describes the battle (Uhud is not named)",hadithReference:"Sahih al-Bukhari 4422; Sahih Muslim 1392 (a mountain that loves us)",historicalReference:"Ibn Hisham, Al-Sirah al-Nabawiyyah",verification:"verified"},
{id:"hira",name:"Cave Hira",location:"Jabal al-Nur, near Makkah",category:"Seerah Site",basis:["Seerah","Prophetic"],description:"The cave where the Prophet ﷺ used to retreat, and where Jibril first came to him with the opening verses of Surah Al-Alaq.",quranReference:"96:1-5 (the cave is not named)",hadithReference:"Sahih al-Bukhari 3",historicalReference:"The first revelation is traditionally dated to 610 CE.",verification:"verified"},
{id:"thawr",name:"Cave Thawr",location:"South of Makkah",category:"Seerah Site",basis:["Qur'anic","Seerah"],description:"The cave where the Prophet ﷺ and Abu Bakr sheltered for three nights on the Hijrah. The Qur'an mentions the cave without naming it.",quranReference:"9:40",hadithReference:"Sahih al-Bukhari 3653",historicalReference:"Ibn Hisham, Al-Sirah al-Nabawiyyah",verification:"verified"},
{id:"aqsa",name:"Masjid al-Aqsa",location:"Jerusalem",category:"Sacred Place",basis:["Qur'anic","Prophetic"],description:"The sanctuary to which the Prophet ﷺ was taken in the Night Journey, and the first qiblah. In Islamic usage the name refers to the whole sanctuary; the Dome of the Rock is a separate building completed in 691-692 CE.",quranReference:"17:1",hadithReference:"Sahih al-Bukhari 1189; Sahih Muslim 1397",historicalReference:"The qiblah faced it for about 16-17 months after the Hijrah (Sahih al-Bukhari 399).",verification:"verified"},
{id:"jerusalem",name:"Jerusalem",location:"Palestine",category:"Sacred City",basis:["Islamic history","Prophetic"],description:"Known in Arabic as al-Quds. The Qur'an does not name the city; it speaks of the blessed land around Al-Aqsa. Caliph Umar received its surrender in 637-638 CE.",quranReference:"17:1; 5:21 (the holy land)",hadithReference:"Sahih Muslim 1397",historicalReference:"Dates for the surrender vary between 15 and 16 AH in the sources (al-Tabari).",verification:"verified"},
{id:"haram",name:"Masjid al-Haram",location:"Makkah",category:"Mosque",basis:["Qur'anic","Prophetic"],description:"The Sacred Mosque surrounding the Ka'bah, the direction of prayer and the centre of Hajj and Umrah.",quranReference:"2:144; 2:149; 17:1",hadithReference:"Sahih Muslim 1394",historicalReference:"Enlarged repeatedly from the time of Umar and Uthman to the present day.",verification:"verified"},
{id:"arafat",name:"Arafat",location:"East of Makkah",category:"Hajj Site",basis:["Qur'anic","Prophetic"],description:"The plain where pilgrims stand on the 9th of Dhul-Hijjah. Standing at Arafah is the essential rite of Hajj.",quranReference:"2:198",hadithReference:"Sahih Muslim 1348; Sahih Muslim 1218",historicalReference:"The Prophet ﷺ gave the Farewell Sermon here in 10 AH.",verification:"verified"},
{id:"mina",name:"Mina",location:"East of Makkah",category:"Hajj Site",basis:["Prophetic","Geography"],description:"A valley where pilgrims stay during the days of Tashreeq and stone the three jamarat. Mina is not named in the Qur'an.",quranReference:"2:203 (appointed days of remembrance; Mina not named)",hadithReference:"Sahih Muslim 1218",historicalReference:"Its facilities are modern; the rites follow the Prophet's Hajj.",verification:"verified"},
{id:"muzdalifah",name:"Muzdalifah",location:"Between Arafat and Mina",category:"Hajj Site",basis:["Qur'anic","Prophetic"],description:"Where pilgrims spend the night after Arafah. Al-Mash'ar al-Haram in 2:198 is commonly identified with it.",quranReference:"2:198",hadithReference:"Sahih Muslim 1218",historicalReference:"Pilgrims also collect pebbles here for stoning, according to the Sunnah.",verification:"scholarly_difference"},
{id:"safamarwah",name:"Safa and Marwah",location:"Makkah",category:"Hajj Site",basis:["Qur'anic","Prophetic"],description:"Two hills now within Masjid al-Haram. Pilgrims walk between them seven times (sa'i), recalling Hajar's search for water for her son Isma'il.",quranReference:"2:158",hadithReference:"Sahih al-Bukhari, Book of the Prophets (Hajar and Isma'il)",historicalReference:"The Qur'an calls them among the symbols of Allah.",verification:"verified"},
{id:"zamzam",name:"Zamzam",location:"Makkah",category:"Sacred Place",basis:["Prophetic","Islamic history"],description:"The well beside the Ka'bah. Its water is described in hadith as blessed. The Qur'an does not mention Zamzam by name.",quranReference:"Not mentioned by name",hadithReference:"Sahih Muslim 2473",historicalReference:"Its association with Hajar and Isma'il comes from Sahih al-Bukhari, Book of the Prophets.",verification:"verified"},
{id:"sinai",name:"Mount Sinai",location:"Egypt",category:"Prophet's Place",basis:["Qur'anic","Geography"],description:"Where Musa was addressed and given the Torah. The Qur'an calls it al-Tur and Tur Sina; the modern Jabal Musa identification is a tradition, not stated in the Qur'an.",quranReference:"95:2; 23:20; 28:46; 20:80",hadithReference:"",historicalReference:"Which mountain in Sinai is meant is a matter of tradition.",verification:"scholarly_difference"},
{id:"redsea",name:"The Red Sea",location:"Between Africa and Arabia",category:"Sea",basis:["Qur'anic","Geography"],description:"The Qur'an says Musa's people crossed when the sea was split, without naming it or the crossing point. Today the Red Sea is a sea about 2,250 km long.",quranReference:"26:63; 20:77",hadithReference:"",historicalReference:"The place of the crossing is not established.",verification:"scholarly_difference"},
{id:"twoseas",name:"The Two Seas",location:"Not named",category:"Sea",basis:["Qur'anic"],description:"The Qur'an speaks of two bodies of water that meet while a barrier keeps them from mixing. It names no location, and commentators differ; no modern place is established as the one described.",quranReference:"55:19-20; 25:53; 35:12",hadithReference:"",historicalReference:"Classical tafsir offers several interpretations.",verification:"scholarly_difference"},
{id:"nile",name:"The Nile",location:"Egypt and Sudan",category:"River",basis:["Prophetic","Geography","Islamic history"],description:"A river about 6,650 km long flowing north into the Mediterranean, the lifeline of Egypt. The Qur'an does not name it, though many commentators understand al-yamm in 20:39 as the Nile. A hadith counts the Nile among rivers seen by the Prophet ﷺ on the Night Journey.",quranReference:"20:39 (al-yamm; the Nile is not named)",hadithReference:"Sahih al-Bukhari 3207; Sahih Muslim 164",historicalReference:"Egypt came under Muslim rule in 641-642 CE.",verification:"verified"},
{id:"judi",name:"Mount Judi",location:"Not established",category:"Prophet's Place",basis:["Qur'anic"],description:"The Qur'an says Nuh's ark came to rest on al-Judi. Traditions often place it in the region of modern south-east Turkey, but the exact location is not established.",quranReference:"11:44",hadithReference:"",historicalReference:"Locations are from later tradition.",verification:"scholarly_difference"},
{id:"hijr",name:"Al-Hijr",location:"Northwest Arabia",category:"Qur'anic Place",basis:["Qur'anic","Prophetic","Geography"],description:"The Qur'an mentions the companions of al-Hijr, who denied the messengers. It is commonly linked with Mada'in Salih (Hegra), listed by UNESCO in 2008. The Prophet ﷺ passed it on the way to Tabuk and told his Companions how to behave there.",quranReference:"15:80",hadithReference:"Sahih al-Bukhari, Book of Maghazi (Tabuk)",historicalReference:"The link with Hegra is a common identification.",verification:"scholarly_difference"},
{id:"babylon",name:"Babylon",location:"Iraq",category:"Qur'anic Place",basis:["Qur'anic","Geography"],description:"Mentioned once by name (Babil) in the story of Harut and Marut. The ancient city stood on the Euphrates about 85 km south of modern Baghdad.",quranReference:"2:102",hadithReference:"",historicalReference:"UNESCO World Heritage Site since 2019.",verification:"verified"},
{id:"qiblatayn",name:"Masjid al-Qiblatayn",location:"Madinah",category:"Mosque",basis:["Qur'anic","Seerah"],description:"The mosque named for the two qiblahs. A tradition says the change of direction from Jerusalem to the Ka'bah was revealed here during prayer.",quranReference:"2:144",hadithReference:"Sahih al-Bukhari 399; Sahih Muslim 525",historicalReference:"The link to this particular mosque is from later tradition.",verification:"verified"},
{id:"damascus",name:"Damascus",location:"Syria",category:"Islamic City",basis:["Islamic history","Prophetic"],description:"Capital of the Umayyad caliphate (661-750 CE). The Umayyad Mosque was built by al-Walid I in the early 700s.",quranReference:"",hadithReference:"Sahih Muslim 2937 (Isa's descent near Damascus)",historicalReference:"Taken by Muslim armies in the 630s.",verification:"verified"},
{id:"baghdad",name:"Baghdad",location:"Iraq",category:"Islamic City",basis:["Islamic history"],description:"Founded in 762 CE by the Abbasid caliph al-Mansur. It was a major centre of the translation and scholarship movement; historians debate how institutional the 'House of Wisdom' was.",quranReference:"",hadithReference:"",historicalReference:"Sacked by the Mongols in 1258.",verification:"verified"},
{id:"cairo",name:"Cairo",location:"Egypt",category:"Islamic City",basis:["Islamic history"],description:"Founded in 969 CE by the Fatimid general Jawhar al-Siqilli. Earlier Muslim rule in Egypt centred on Fustat, founded after the conquest of 641-642 CE.",quranReference:"",hadithReference:"",historicalReference:"Later a major seat of Mamluk learning and rule.",verification:"verified"},
{id:"azhar",name:"Al-Azhar",location:"Cairo",category:"Centre of Learning",basis:["Islamic history"],description:"Founded as a mosque by the Fatimids around 970-972 CE and later a major teaching centre. Calling it the 'first Islamic university' is debated: Al-Qarawiyyin in Fez (859 CE) is often cited as older, and Al-Azhar took modern university form in 1961.",quranReference:"",hadithReference:"",historicalReference:"UNESCO and Guinness recognise Al-Qarawiyyin as the oldest existing institution of its kind.",verification:"scholarly_difference"},
{id:"kairouan",name:"Kairouan",location:"Tunisia",category:"Islamic City",basis:["Islamic history"],description:"Founded around 670 CE by Uqba ibn Nafi as a base for the Muslim conquest of North Africa. Its Great Mosque and scholars made it an early centre of learning, including of the Maliki school.",quranReference:"",hadithReference:"",historicalReference:"UNESCO World Heritage Site since 1988.",verification:"verified"},
{id:"cordoba",name:"Cordoba",location:"Spain",category:"Islamic City",basis:["Islamic history"],description:"Capital of Muslim al-Andalus. Its Great Mosque was begun in 784 CE by Abd al-Rahman I. Medieval claims that its caliphal library held 400,000 volumes are doubted by many historians.",quranReference:"",hadithReference:"",historicalReference:"The caliphate of Cordoba was declared in 929 CE.",verification:"verified"},
{id:"timbuktu",name:"Timbuktu",location:"Mali",category:"Centre of Learning",basis:["Islamic history"],description:"A West African centre of Islamic scholarship, especially from the 14th to 16th centuries, around the Sankore, Djinguereber and Sidi Yahya mosques. Its manuscript collections are estimated in the tens of thousands or more.",quranReference:"",hadithReference:"",historicalReference:"UNESCO World Heritage Site since 1988.",verification:"verified"},
{id:"qarawiyyin",name:"Al-Qarawiyyin",location:"Fez, Morocco",category:"Centre of Learning",basis:["Islamic history"],description:"Founded in 859 CE by Fatima al-Fihri. UNESCO and Guinness recognise it as the oldest existing, continually operating educational institution. It began as a mosque; when it became a formal university is debated.",quranReference:"",hadithReference:"",historicalReference:"Reorganised as a modern university in the 20th century.",verification:"scholarly_difference"}
];

const FACTS={kaabah:["Muslims everywhere face it in prayer (the qiblah).","The Black Stone is set in its southeastern corner, and the Kiswa cloth covers the structure."],makkah:["It lies in a valley in the Hijaz region of western Arabia.","The central sacred area (haram) is closed to non-Muslims."],madinah:["Its earlier name was Yathrib.","The Constitution of Madinah, from the first years after the Hijrah, organised relations between its communities."],nabawi:["The green dome over the Prophet's ﷺ chamber was added in later centuries and painted green in 1837.","A hadith calls the area between his house and his minbar a garden of the gardens of Paradise (Sahih al-Bukhari 1196; Sahih Muslim 1391)."],quba:["It lies a few kilometres south of the Prophet's Mosque.","A hadith in Sunan Ibn Majah likens a prayer there to an Umrah."],uhud:["The battle took place in Shawwal, 3 AH.","The Prophet ﷺ was wounded and about seventy Muslims were martyred."],hira:["It sits near the summit of Jabal al-Nur.","Before the revelation, the Prophet ﷺ spent nights there in worship (Sahih al-Bukhari 3)."],thawr:["The Prophet ﷺ and Abu Bakr stayed three nights before setting out for Madinah.","Asma' bint Abi Bakr brought them provisions (Sahih al-Bukhari, Hijrah narration)."],aqsa:["The Night Journey (Isra') began at Masjid al-Haram and reached Al-Aqsa.","A hadith says the two mosques were founded forty years apart (Sahih al-Bukhari 3366; Sahih Muslim 520)."],jerusalem:["Prophets such as Dawud, Sulayman and Isa are connected with the surrounding land in Islamic tradition.","The Covenant of Umar is attributed to the surrender; some historians question details of its text."],haram:["It is among the largest mosques in the world.","The Station of Ibrahim (Maqam Ibrahim) stands near the Ka'bah (Qur'an 2:125)."],arafat:["The Day of Arafah is the 9th of Dhul-Hijjah.","In the Prophet's ﷺ Sunnah the standing runs from after midday until sunset."],mina:["Pilgrims spend the days of Tashreeq there.","Stoning begins with Jamrat al-Aqabah on the 10th."],muzdalifah:["Pilgrims combine Maghrib and Isha prayers here.","They stay until near dawn, then move on to Mina."],safamarwah:["Seven laps are made, beginning at Safa and ending at Marwah.","Sa'i is performed in both Hajj and Umrah."],zamzam:["The well lies near the Ka'bah and still supplies pilgrims.","Its story is linked to Hajar and Isma'il in Sahih al-Bukhari."],sinai:["The Qur'an calls it al-Tur, Tur Sina and Tur Sinin.","It recalls Musa's call at the side of the mountain (28:29-30)."],redsea:["It connects to the Indian Ocean through the Bab al-Mandab strait.","Its two northern gulfs are Suez and Aqaba."],twoseas:["The word used for the separation is barzakh, a barrier (55:20; 25:53).","Some commentators take it to mean salt and fresh water; others give different meanings."],nile:["Its basin spans eleven countries.","Its two main branches, the White and Blue Nile, meet at Khartoum."],judi:["The Qur'an says the ark settled on al-Judi after the flood (11:44).","Surah Hud, which contains this verse, is named after the prophet Hud."],hijr:["Surah al-Hijr (15) takes its name from this place.","Hegra is known today for its rock-cut tombs."],babylon:["It was a capital of ancient Mesopotamia.","The Qur'an mentions it in 2:102 in the context of magic."],qiblatayn:["Qiblatayn means 'the two qiblahs'.","The Prophet ﷺ prayed towards Jerusalem for about 16-17 months after the Hijrah."],damascus:["It is among the oldest continuously inhabited cities in the world.","The Umayyad Mosque stands on a site earlier occupied by the Church of St John the Baptist."],baghdad:["Its original plan was circular, known as the Round City.","The Tigris runs through it."],cairo:["Its name al-Qahira is usually explained as 'the Victorious'.","The Citadel was begun by Salah al-Din in the 1170s."],azhar:["Its name is usually linked to Fatima al-Zahra', the daughter of the Prophet ﷺ.","Today it includes both a mosque and a university."],kairouan:["Its Great Mosque is also called the Mosque of Uqba.","Its minaret is among the oldest surviving in the Islamic world."],cordoba:["Its Great Mosque became a cathedral after the city fell in 1236.","The philosopher Ibn Rushd (Averroes) was born there."],timbuktu:["The Djinguereber Mosque dates from the 1320s, in the era of Mansa Musa.","Its manuscripts cover Qur'anic sciences, law, astronomy and medicine."],qarawiyyin:["Its library is among the oldest in the world, restored in 2016.","Fatima's sister Mariam founded the Al-Andalusiyyin Mosque in Fez."]};

function lose(m){clearInterval(tm);G.lock=true;G.lv--;const L=G.L,v=G.lv;beep(150,.4);$("ovl").innerHTML=`<div class="ov"><div class="card"><h3>${m}</h3><p class="m">${v?v+" ♥ remaining":"No lives left"}</p><button class="b p" id="rt">${v?"Try again":"Back to levels"}</button></div></div>`;$("rt").onclick=()=>{$("ovl").innerHTML="";v?start(L,v):openPhase(phOf(L))}}
const SC={kaaba:'<rect x="75" y="26" width="50" height="46" fill="#222"/><rect x="75" y="37" width="50" height="6" fill="var(--gold)"/><rect x="92" y="50" width="10" height="22" fill="var(--gold)"/>',
mosque:'<rect x="55" y="48" width="80" height="24" fill="var(--ac)"/><path d="M65 48a30 28 0 0 1 60 0z" fill="var(--ac)"/><rect x="145" y="24" width="9" height="48" fill="var(--ac)"/><path d="M144 24l5.5-11 5.5 11z" fill="var(--gold)"/><circle cx="95" cy="18" r="3" fill="var(--gold)"/>',
dome:'<path d="M70 72V52h60v20z" fill="#2f80c4"/><path d="M74 52a26 26 0 0 1 52 0z" fill="var(--gold)"/><rect x="99" y="18" width="2" height="8" fill="var(--gold)"/>',
mountain:'<path d="M15 72L72 22l42 50z" fill="#8b7d6b"/><path d="M80 72l48-42 56 42z" fill="#a39482"/>',
cave:'<path d="M30 72L100 15l70 57z" fill="#8b7d6b"/><path d="M85 72V58a15 15 0 0 1 30 0v14z" fill="#1c1c1c"/>',
sea:'<rect y="40" width="200" height="50" fill="#2f80c4"/><path d="M0 54q12-8 25 0t25 0 25 0 25 0 25 0 25 0 25 0M0 70q12-8 25 0t25 0 25 0 25 0 25 0 25 0 25 0" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>',
river:'<path d="M0 88C60 72 90 62 112 46S170 22 200 14V90H0z" fill="#2f80c4"/><path d="M30 72V48M30 48q-12-7-17-2M30 48q12-7 17-2" stroke="var(--ac)" stroke-width="3" fill="none"/>',
city:'<rect x="18" y="46" width="26" height="26" fill="var(--ac)"/><rect x="50" y="34" width="22" height="38" fill="var(--ac)"/><rect x="128" y="40" width="26" height="32" fill="var(--ac)"/><rect x="160" y="50" width="22" height="22" fill="var(--ac)"/><path d="M78 72V54h42v18zM82 54a17 15 0 0 1 34 0z" fill="var(--gold)"/>',
school:'<path d="M38 72V42l62-24 62 24v30z" fill="var(--ac)"/><rect x="62" y="48" width="9" height="24" fill="var(--card)"/><rect x="96" y="48" width="9" height="24" fill="var(--card)"/><rect x="130" y="48" width="9" height="24" fill="var(--card)"/>',
well:'<rect x="76" y="42" width="48" height="30" fill="#8a8a85"/><ellipse cx="100" cy="42" rx="24" ry="8" fill="#6e6e69"/><ellipse cx="100" cy="42" rx="18" ry="5" fill="#2f80c4"/>',
plain:'<circle cx="160" cy="24" r="10" fill="var(--gold)"/><path d="M20 72l18-24 18 24zM62 72l18-24 18 24zM104 72l18-24 18 24z" fill="var(--card)" stroke="var(--gold)" stroke-width="1.5"/>'};
const pic=id=>`<svg viewBox="0 0 200 90" style="width:100%;border-radius:10px;display:block" stroke="none"><rect width="200" height="90" fill="var(--dim)"/><rect y="72" width="200" height="18" fill="var(--bd)"/>${SC[ART[id]]||SC.city}</svg><div class="m" style="font-size:11px;text-align:right;margin-bottom:4px">Illustration</div>`;
function pcard(p){return pic(p.id)+`<div class="cat"><span>${p.category}</span><span>${p.basis.join(" · ")}</span></div><h3 style="margin:6px 0 2px">${p.name.toUpperCase()}</h3><div class="m">${p.location}</div><p>${p.description}</p>${(FACTS[p.id]||[]).length?`<div class="cat" style="margin:8px 0 2px">Did you know</div><ul style="margin:4px 0;padding-left:18px;font-size:14px">${FACTS[p.id].map(f=>`<li>${f}</li>`).join("")}</ul>`:""}<button class="b" onclick="this.nextSibling.hidden=!this.nextSibling.hidden">Learn More</button><div class="note" hidden>${p.quranReference?"<b>Qur'an:</b> "+p.quranReference+"<br>":""}${p.hadithReference?"<b>Hadith:</b> "+p.hadithReference+"<br>":""}${p.historicalReference?"<b>History:</b> "+p.historicalReference+"<br>":""}<b>${p.verification=="scholarly_difference"?"Scholars or sources differ on part of this":"Verified"}</b></div>`}
function win(){clearInterval(tm);const L=G.L,bonus=50*L,p=PLACES[L-1];S.kp+=bonus;G.sc+=bonus;S.mx=Math.min(Math.max(S.mx,L+1),TOTAL);if(p&&!S.d.includes(p.id))S.d.push(p.id);badges();save();beep(1000,.5);A.say("level");
const end=L>=TOTAL;$("ovl").innerHTML=`<div class="ov"><div class="card"><h3>Level ${L} complete</h3><p><b>Mā shā' Allāh!</b> You passed.</p><p class="m">+${bonus} Knowledge Points · ★ ${G.sc}</p>${p?`<hr style="border:0;border-top:1px solid var(--bd)"><div class="cat" style="margin:10px 0">Discover</div>${pcard(p)}`:""}<button class="b p" id="nl">${end?"Phases":"Continue"}</button><button class="b" id="bk">Home</button></div></div>`;
$("nl").onclick=()=>{$("ovl").innerHTML="";end?(G=null,show("ph")):go(L+1)};$("bk").onclick=()=>{$("ovl").innerHTML="";G=null;show("home")}}
function quit(){clearInterval(tm);G=null;show("home")}
// ---- Daily Ilm: same 10 questions for everyone each day, one per category
function daily(){if(S.dd==today()){toast("Today's Ilm is complete. Return tomorrow.");return}G=null;
let h=0;for(const c of today())h=(h*31+c.charCodeAt(0))|0;const r=()=>(h=Math.imul(h^h>>>15,h|1),h^=h+Math.imul(h^h>>>7,h|61),((h^h>>>14)>>>0)/4294967296);
const sr=(a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ids=dailyIds(sr);
let n=0,lv=3,t=150,done=0;const fin=m=>{if(done)return;done=1;clearInterval(d);$("ovl").innerHTML="";const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.st=S.last==y?S.st+1:1;S.last=today();S.dd=today();if(lv>0&&n>=ids.length){S.kp+=200}badges();save();if(lv>0&&n>=ids.length)A.say("daily");toast(m+" Streak: "+S.st+(lv>0&&n>=ids.length?" · +200 bonus":""));show("home")};
const d=setInterval(()=>{t--;const e=$("dt");if(e)e.textContent=fmt(Math.max(t,0))+" · "+"♥".repeat(lv);if(t<=0)fin("Time is up.")},1000),nx=()=>{if(done)return;if(n>=ids.length||lv<=0)return fin(lv?"Complete.":"Out of lives.");ask(ids[n++],2,ok=>{if(!ok)lv--;nx()})};nx()}
// ---- Knowledge (what you have answered correctly, with sources) and Profile
function atlas(i){$("ovl").innerHTML=`<div class="ov"><div class="card">${pcard(PLACES[i])}<button class="b p" onclick="$('ovl').innerHTML=''">Close</button></div></div>`}
function know(){show("pf");const L=[...S.learn].reverse();$("pf").innerHTML=`<div class="top"><button onclick="show('home')">‹</button><b>MY KNOWLEDGE ATLAS</b><span></span></div><div class="m">${S.d.length} of ${TOTAL} discovered</div>`+PLACES.slice(0,TOTAL).map((p,i)=>{const u=S.d.includes(p.id);return u?`<button class="b" style="text-align:left" onclick="atlas(${i})">${p.name}<br><span class="m">${p.location} · ${p.category}</span></button>`:`<div class="b" style="opacity:.4;text-align:left">${p.name}<br><span class="m">Complete Level ${i+1} to unlock</span></div>`}).join("")+`<h4>Answers you have learned</h4>`+(L.length?L.map(i=>`<div class="card" style="margin:10px 0"><div class="cat"><span>${CL[Q[i][0]]}</span></div><p><b>${Q[i][3][0]}</b> · ${Q[i][2]}</p><p>${Q[i][4]}</p><p class="m">${Q[i][5]}</p></div>`).join(""):'<p class="m">Correct answers are kept here with their sources.</p>')}
function prof(){show("pf");const f=["quran","hadith","seerah","fiqh","arabic","history"];$("pf").innerHTML=`<div class="top"><button onclick="show('home')">‹</button><b>Profile</b><span></span></div>
<div class="row"><span>Knowledge Points</span><b>${S.kp}</b></div><div class="row"><span>Level</span><b>${plv()}</b></div><div class="row"><span>Questions answered</span><b>${S.a}</b></div><div class="row"><span>Accuracy</span><b>${S.a?Math.round(100*S.c/S.a):0}%</b></div><div class="row"><span>Current streak</span><b>${S.st}</b></div>
${f.map(k=>`<div class="row"><span>${CL[k]}</span><span>${cc(k)} correct</span></div>`).join("")}
<h4>Badges</h4>${BG.map(([n,d])=>`<div class="row" style="opacity:${S.b.includes(n)?1:.4}"><span>${n}</span><span class="m">${d}</span></div>`).join("")}${A.panel()}<button class="b" style="margin-top:16px" onclick="S.m=!S.m;save();prof()">Sound: ${S.m?"off":"on"}</button><button class="b" onclick="rst(this)">Reset progress</button>`}
function rst(b){if(!b.dataset.c){b.dataset.c=1;b.textContent="Tap again to erase all progress";return}try{localStorage.removeItem("ilmq")}catch(e){}location.reload()}
// ---- scenic backgrounds (original flat illustrations) + opening splash
const SCN=[["#f7e8c9","#dcbf8d","#c9a46f","#b78d59","#f3c969","kaaba"],["#fbe6d0","#e3c39a","#d3a977","#bf9360","#f2b86b","plain"],["#d4eaf6","#8cc0a0","#58a67f","#388a65","#f6d27a","mountain"],["#e8f0e4","#9ec9ae","#5fae8a","#2f8f6c","#e7c76a","city"]];
const scene=p=>{const[c0,c1,c2,c3,sn,lm]=SCN[Math.min(p,3)];return`<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;display:block" stroke="none"><rect width="400" height="800" fill="${c0}"/><circle cx="310" cy="200" r="42" fill="${sn}" opacity=".85"/><path d="M0 520Q90 470 190 510T400 480V800H0z" fill="${c1}"/><g transform="translate(10 395) scale(1.9)">${SC[lm].replace(/<circle cx="160"[^>]*>/,"")}</g><path d="M0 600Q120 540 220 585T400 560V800H0z" fill="${c2}"/><path d="M0 690Q140 640 260 680T400 660V800H0z" fill="${c3}"/><path d="M160 800Q190 740 235 705" stroke="#fff" stroke-width="10" opacity=".35" fill="none" stroke-linecap="round"/></svg>`};
function splash(){const L=nxt(),p=phOf(L),done=Math.max(0,L-1),pct=Math.round(100*done/TOTAL),d=document.createElement("div");d.id="splash";
d.style.cssText="position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;justify-content:space-between;color:#1f2d27;transition:opacity .4s";
d.innerHTML=`<div style="position:absolute;inset:0">${scene(p)}</div><div style="position:relative;padding:max(56px,env(safe-area-inset-top)) 28px 0;font-size:26px;font-weight:700;line-height:1.4;max-width:460px">${A.open}</div><div style="position:relative;padding:0 28px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;max-width:520px;width:100%;margin:auto auto 0"><div style="font-size:14px;font-weight:600;margin-bottom:14px">${done?done+" of "+TOTAL+" levels · "+PHASES[p].name:"Your journey begins"}</div><div style="position:relative;height:16px;background:#ffffffb0;border:2px solid #fff;border-radius:10px"><div id="spf" style="height:100%;width:0;background:#0e7a5a;border-radius:8px;transition:width 1.8s ease"></div><div id="spm" style="position:absolute;top:-14px;left:0;width:36px;height:36px;margin-left:-18px;border-radius:9px;background:#fff;border:1px solid #cfe0d6;box-shadow:0 2px 3px #0003;display:grid;place-items:center;transition:left 1.8s ease"><svg viewBox="0 0 48 48" style="width:26px;height:26px"><text x="24" y="35" text-anchor="middle" style="fill:#0e7a5a;font-weight:700" font-size="32" font-family="'Amiri','Noto Naskh Arabic',serif">ع</text></svg></div></div><div style="margin-top:20px;font-weight:700;letter-spacing:5px;color:#0e7a5a">ILM QUEST</div><div style="margin-top:6px;font-size:12px">Tap to continue</div></div>`;
document.body.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>{$("spf").style.width=pct+"%";$("spm").style.left=pct+"%"}));
let gone=false;const end=()=>{if(gone)return;gone=true;d.style.opacity=0;setTimeout(()=>d.remove(),420)};d.onclick=end;setTimeout(end,3400)}
show("home");splash();try{if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
